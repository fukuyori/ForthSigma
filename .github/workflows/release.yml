# Tests FORTH/Sigma and builds it for each target, with and without the floating-point
# words. A vVERSION tag also publishes the Linux x86_64 ZIPs to a GitHub Release. The
# other ZIPs remain run artifacts; the Windows builds are unsigned, and signed Windows
# ZIPs come from scripts/build-zip.ps1 -Sign.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.0

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
      # The release builds target the baseline x86-64 CPU, which has no FMA instruction,
      # so the math functions take a different path there than on the runner's CPU.
      - if: runner.arch == 'X64'
        run: zig build test -Dcpu=baseline --summary all
      - if: runner.arch == 'X64'
        run: zig build test -Dcpu=baseline -Doptimize=fast --summary all
      # The build without floating-point words (-Dfloat=false).
      - run: zig build test -Dfloat=false --summary all
      # The build without any of the word groups that can be left out.
      - run: zig build test -Dfloat=false -Dfiles=false -Dhelp=false -Dtools=false -Dimage=false -Dgraphics=false -Ddebug=false --summary all

  build:
    name: Build ${{ matrix.platform.name }}${{ matrix.variant.suffix }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: windows-x86_64, target: x86_64-windows-gnu, exe: sigma.exe }
          - { name: linux-x86_64, target: x86_64-linux-musl, exe: sigma }
          - { name: linux-arm32, target: arm-linux-musleabihf, exe: sigma }
          - { name: linux-arm64, target: aarch64-linux-musl, exe: sigma }
          - { name: macos-arm64, target: aarch64-macos, exe: sigma }
        # Each platform with the floating-point words and without them (-Dfloat=false).
        variant:
          - { float: 'true', suffix: '' }
          - { float: 'false', suffix: '-nofloat' }
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match VERSION ($version)."
            exit 1
          fi
      - run: zig build -Doptimize=fast -Dfloat=${{ matrix.variant.float }} -Dtarget=${{ matrix.platform.target }} --prefix out
      - name: Package
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          dir="sigma-$version-${{ matrix.platform.name }}${{ matrix.variant.suffix }}"
          mkdir "$dir"
          cp "out/bin/${{ matrix.platform.exe }}" LICENSE THIRD_PARTY_NOTICES.md README.md "$dir/"
          # The example programs, in the ZIP of the version with floating-point words
          # (some of them need those words).
          if [ "${{ matrix.variant.float }}" = "true" ]; then
            mkdir "$dir/examples"
            cp examples/*.fs "$dir/examples/"
          fi
          zip -r "$dir.zip" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: sigma-${{ matrix.platform.name }}${{ matrix.variant.suffix }}
          path: sigma-*.zip
          if-no-files-found: error

  release-linux-x86_64:
    name: Publish Linux x86_64 release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: sigma-linux-x86_64*
          path: release-assets
          merge-multiple: true
      - name: Verify version and publish Linux x86_64 ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "The tag $RELEASE_TAG does not match VERSION ($version)." >&2
            exit 1
          fi
          cd release-assets
          assets=("sigma-$version-linux-x86_64.zip" "sigma-$version-linux-x86_64-nofloat.zip")
          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]] || { echo "Missing release asset: $asset" >&2; exit 1; }
            sha256sum "$asset" > "$asset.sha256"
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" "${assets[0]}.sha256" "${assets[1]}.sha256" \
            --repo "$GH_REPO" --verify-tag --title "FORTH/Sigma $RELEASE_TAG" --generate-notes
