# Builds FORTH/Sigma for each target and, for a tag vX.Y.Z, attaches the ZIP files to a
# draft release. The Windows build is unsigned; replace it with the signed ZIP of the
# same name and contents that scripts/build-zip.ps1 -Sign makes before publishing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.16.0

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
      # The release builds target the baseline x86-64 CPU, which has no FMA instruction,
      # so the math functions take a different path there than on the runner's CPU.
      - if: runner.arch == 'X64'
        run: zig build test -Dcpu=baseline --summary all
      - if: runner.arch == 'X64'
        run: zig build test -Dcpu=baseline -Doptimize=ReleaseFast --summary all

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x86_64, target: x86_64-windows-gnu, exe: sigma.exe }
          - { name: linux-x86_64, target: x86_64-linux-musl, exe: sigma }
          - { name: linux-arm32, target: arm-linux-musleabihf, exe: sigma }
          - { name: linux-arm64, target: aarch64-linux-musl, exe: sigma }
          - { name: macos-arm64, target: aarch64-macos, exe: sigma }
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match VERSION ($version)."
            exit 1
          fi
      - run: zig build -Doptimize=ReleaseFast -Dtarget=${{ matrix.target }} --prefix out
      - name: Package
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          dir="sigma-$version-${{ matrix.name }}"
          mkdir "$dir"
          cp "out/bin/${{ matrix.exe }}" LICENSE THIRD_PARTY_NOTICES.md README.md forth/sigma/USER_MANUAL.md "$dir/"
          zip -r "$dir.zip" "$dir"
      - uses: actions/upload-artifact@v7
        with:
          name: sigma-${{ matrix.name }}
          path: sigma-*.zip
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "FORTH/Sigma $GITHUB_REF_NAME" \
            --notes "Builds for Windows x86_64, Linux x86_64, arm32, and arm64, and macOS arm64."
