# Tests FORTH/Sigma and builds the full and Forth 2012 profiles for each target. A
# vVERSION tag also publishes the Linux x86_64 ZIPs to a GitHub Release. The
# other ZIPs remain run artifacts; the Windows builds are unsigned, and signed Windows
# ZIPs come from scripts/build-zip.ps1 -Sign.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  ZIG_VERSION: 0.17.1

jobs:
  test:
    name: Test on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build test --summary all
      # The release builds target the baseline x86-64 CPU, which has no FMA instruction,
      # so the math functions take a different path there than on the runner's CPU.
      - if: runner.arch == 'X64'
        run: zig build test -Dcpu=baseline --summary all
      - if: runner.arch == 'X64'
        run: zig build test -Dcpu=baseline -Doptimize=fast --summary all
      # Keep exercising the floating-point-free build, which remains available for
      # the separately signed macOS package workflow.
      - run: zig build test -Dfloat=false --summary all
      # The Forth 2012 profile: keep standard word sets, leave out Sigma graphics,
      # sound, and extension vocabulary.
      - run: zig build test -Dgraphics=false -Daudio=false -Dextension=false --summary all
      # Also retain coverage for a build with the optional nonstandard groups removed.
      - run: zig build test -Dfloat=false -Dfiles=false -Dhelp=false -Dtools=false -Dimage=false -Dgraphics=false -Ddebug=false --summary all

  build:
    name: Build ${{ matrix.platform.name }}${{ matrix.variant.suffix }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { name: windows-x86_64, target: x86_64-windows-gnu, exe: sigma.exe }
          - { name: linux-x86_64, target: x86_64-linux-musl, exe: sigma }
          - { name: linux-arm64, target: aarch64-linux-musl, exe: sigma }
          - { name: macos-arm64, target: aarch64-macos, exe: sigma }
        # Each platform with the full profile and the Forth 2012 profile.
        variant:
          - { graphics: 'true', audio: 'true', extension: 'true', examples: 'true', suffix: '' }
          - { graphics: 'false', audio: 'false', extension: 'false', examples: 'false', suffix: '-forth2012' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Check that the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match VERSION ($version)."
            exit 1
          fi
      - run: zig build -Doptimize=fast -Dgraphics=${{ matrix.variant.graphics }} -Daudio=${{ matrix.variant.audio }} -Dextension=${{ matrix.variant.extension }} -Dtarget=${{ matrix.platform.target }} --prefix out
      - name: Package
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          dir="sigma-$version-${{ matrix.platform.name }}${{ matrix.variant.suffix }}"
          mkdir "$dir"
          cp "out/bin/${{ matrix.platform.exe }}" LICENSE THIRD_PARTY_NOTICES.md README.md "$dir/"
          # Examples use graphics and audio, so they go only in the full ZIP.
          if [ "${{ matrix.variant.examples }}" = "true" ]; then
            mkdir "$dir/examples"
            cp examples/*.fs "$dir/examples/"
          fi
          # Sigma-specific libraries belong only in the full ZIP.
          if [ "${{ matrix.variant.examples }}" = "true" ]; then
            mkdir "$dir/include"
            cp include/*.fs "$dir/include/"
          fi
          zip -r "$dir.zip" "$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sigma-${{ matrix.platform.name }}${{ matrix.variant.suffix }}
          path: sigma-*.zip
          if-no-files-found: error

  release-linux-x86_64:
    name: Publish Linux x86_64 release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: sigma-linux-x86_64*
          path: release-assets
          merge-multiple: true
      - name: Verify version and publish Linux x86_64 ZIPs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "The tag $RELEASE_TAG does not match VERSION ($version)." >&2
            exit 1
          fi
          cd release-assets
          assets=("sigma-$version-linux-x86_64.zip" "sigma-$version-linux-x86_64-forth2012.zip")
          for asset in "${assets[@]}"; do
            [[ -s "$asset" ]] || { echo "Missing release asset: $asset" >&2; exit 1; }
            sha256sum "$asset" > "$asset.sha256"
          done
          gh release create "$RELEASE_TAG" "${assets[@]}" "${assets[0]}.sha256" "${assets[1]}.sha256" \
            --repo "$GH_REPO" --verify-tag --title "FORTH/Sigma $RELEASE_TAG" --generate-notes
